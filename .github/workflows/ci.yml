name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: shellcheck installer and launcher
        run: |
          shellcheck install.sh
          awk "/^cat >\"\\\$\{BIN\}.new\" <<'WRAPPER'/{f=1;next} /^WRAPPER\$/{f=0} f" install.sh > launcher.sh
          test -s launcher.sh
          shellcheck launcher.sh
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/marcocolomb0/rightsizer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/marcocolomb0/rightsizer@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: |
          docker pull -q ghcr.io/marcocolomb0/rightsizer@${{ steps.build.outputs.digest }}
          docker image ls --format '{{.Repository}} {{.Size}}' ghcr.io/marcocolomb0/rightsizer >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/marcocolomb0/rightsizer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  appliance-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install appliance tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils sshpass gnupg e2fsprogs >/dev/null
          sudo curl -fsSL -o /usr/local/bin/butane https://github.com/coreos/butane/releases/download/v0.29.0/butane-x86_64-unknown-linux-gnu
          echo "53a20d820fbaa7fda4f1afd1814974badc8e448db4c151d3f1ba005dc29bc4c9  /usr/local/bin/butane" | sha256sum -c -
          sudo chmod 0755 /usr/local/bin/butane
      - run: shellcheck appliance/build.sh appliance/smoke-test.sh appliance/files/rightsizer-host
      - run: docker build --build-arg VERSION=v0.0.0 -t ghcr.io/marcocolomb0/rightsizer:0.0.0 .
      - run: WORK="$RUNNER_TEMP/smoke" appliance/smoke-test.sh ghcr.io/marcocolomb0/rightsizer:0.0.0
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appliance-serial-log
          path: ${{ runner.temp }}/smoke/serial.log

  ova:
    needs: [image, appliance-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install appliance tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils sshpass gnupg e2fsprogs >/dev/null
          sudo curl -fsSL -o /usr/local/bin/butane https://github.com/coreos/butane/releases/download/v0.29.0/butane-x86_64-unknown-linux-gnu
          echo "53a20d820fbaa7fda4f1afd1814974badc8e448db4c151d3f1ba005dc29bc4c9  /usr/local/bin/butane" | sha256sum -c -
          sudo chmod 0755 /usr/local/bin/butane
      - run: appliance/build.sh "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rightsizer-*.ova
      - uses: actions/upload-artifact@v7
        with:
          name: ova
          path: dist/rightsizer-*.ova
          compression-level: 0

  release:
    needs: [image, ova]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ova
      - run: sha256sum install.sh rightsizer-*.ova > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: install.sh
      - run: gh release create "$GITHUB_REF_NAME" install.sh rightsizer-*.ova SHA256SUMS --verify-tag --generate-notes --title "rightsizer $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
