variant: flatcar
version: 1.1.0

kernel_arguments:
  should_exist:
    - quiet
  should_not_exist:
    - flatcar.autologin

passwd:
  groups:
    - name: rightsizer
      gid: 65532
      system: true
  users:
    # Owns the engine data (the container runs as 65532) and runs the VM
    # console screen. No password, no shell, no home: nobody can log in.
    - name: rightsizer
      uid: 65532
      primary_group: rightsizer
      no_user_group: true
      no_create_home: true
      shell: /sbin/nologin
      system: true

storage:
  directories:
    - path: /opt/rightsizer/bin
      mode: 0755
    - path: /var/lib/rightsizer
      mode: 0700
  files:
    - path: /opt/rightsizer/bin/rightsizer-host
      mode: 0755
      contents:
        local: rightsizer-host
    - path: /etc/rightsizer/engine.env
      mode: 0644
      contents:
        inline: |
          IMAGE=ghcr.io/marcocolomb0/rightsizer:@IMAGE_TAG@
    - path: /etc/flatcar/update.conf
      mode: 0644
      overwrite: true
      contents:
        inline: |
          GROUP=stable
          REBOOT_STRATEGY=off
    - path: /etc/sysctl.d/90-rightsizer.conf
      mode: 0644
      contents:
        inline: |
          kernel.sysrq=0
          kernel.printk=3 4 1 3
          kernel.kptr_restrict=2
          kernel.dmesg_restrict=1
          kernel.unprivileged_bpf_disabled=1
          net.core.bpf_jit_harden=2
          net.ipv4.conf.all.accept_redirects=0
          net.ipv4.conf.default.accept_redirects=0
          net.ipv4.conf.all.send_redirects=0
          net.ipv4.conf.all.accept_source_route=0
          net.ipv4.conf.all.rp_filter=1
          net.ipv4.tcp_syncookies=1
    - path: /etc/systemd/logind.conf.d/10-rightsizer.conf
      mode: 0644
      contents:
        inline: |
          [Login]
          NAutoVTs=0
          ReserveVT=0
    - path: /etc/docker/daemon.json
      mode: 0644
      contents:
        inline: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" },
            "no-new-privileges": true,
            "icc": false,
            "userland-proxy": false
          }

systemd:
  units:
    - name: sshd.socket
      mask: true
    - name: sshd.service
      mask: true
    - name: getty@.service
      mask: true
    - name: serial-getty@.service
      mask: true
    - name: autovt@.service
      mask: true
    - name: ctrl-alt-del.target
      mask: true
    - name: debug-shell.service
      mask: true

    - name: rightsizer-network.service
      enabled: true
      contents: |
        [Unit]
        Description=Apply rightsizer vApp network settings
        DefaultDependencies=no
        After=systemd-sysext.service local-fs.target
        Before=systemd-networkd.service network-pre.target systemd-timesyncd.service
        Wants=network-pre.target

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/opt/rightsizer/bin/rightsizer-host network

        [Install]
        WantedBy=multi-user.target

    - name: rightsizer.service
      enabled: true
      contents: |
        [Unit]
        Description=rightsizer engine
        After=docker.service network-online.target rightsizer-network.service
        Requires=docker.service
        Wants=network-online.target

        [Service]
        ExecStartPre=/opt/rightsizer/bin/rightsizer-host prepare
        ExecStart=/opt/rightsizer/bin/rightsizer-host engine
        ExecStop=/usr/bin/docker stop -t 60 rightsizer
        TimeoutStartSec=15min
        TimeoutStopSec=90
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=multi-user.target

    - name: rightsizer-console.service
      enabled: true
      contents: |
        [Unit]
        Description=rightsizer status screen on the VM console
        After=rightsizer.service systemd-user-sessions.service
        Conflicts=getty@tty1.service

        [Service]
        ExecStart=/opt/rightsizer/bin/rightsizer console
        Environment=RIGHTSIZER_DATA=/var/lib/rightsizer/data TERM=linux
        User=rightsizer
        Group=rightsizer
        SupplementaryGroups=tty
        StandardInput=null
        StandardOutput=tty
        StandardError=journal
        TTYPath=/dev/tty1
        TTYReset=yes
        TTYVHangup=yes
        Restart=always
        RestartSec=5
        NoNewPrivileges=yes
        CapabilityBoundingSet=
        ProtectSystem=strict
        ProtectHome=yes
        PrivateTmp=yes
        ProtectKernelTunables=yes
        ProtectKernelModules=yes
        ProtectKernelLogs=yes
        ProtectControlGroups=yes
        ProtectClock=yes
        ProtectHostname=yes
        RestrictNamespaces=yes
        RestrictRealtime=yes
        RestrictSUIDSGID=yes
        LockPersonality=yes
        MemoryDenyWriteExecute=yes
        RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
        IPAddressDeny=any
        SystemCallArchitectures=native
        SystemCallFilter=@system-service

        [Install]
        WantedBy=multi-user.target

    - name: rightsizer-upgrade.path
      enabled: true
      contents: |
        [Unit]
        Description=Watch for rightsizer upgrade requests

        [Path]
        PathChanged=/var/lib/rightsizer/data/host/upgrade-request

        [Install]
        WantedBy=multi-user.target

    - name: rightsizer-upgrade.service
      contents: |
        [Unit]
        Description=Upgrade the rightsizer engine

        [Service]
        Type=oneshot
        ExecStart=/opt/rightsizer/bin/rightsizer-host upgrade
        TimeoutStartSec=30min
